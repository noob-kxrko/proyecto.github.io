<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Sorpresa</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎵</text></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        .video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
        }

        .video-fullscreen {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-overlay {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
        }

        .close-btn {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid white;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
            transition: all 0.3s ease;
        }

        .close-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.05);
        }

        /* Confeti animation */
        .confeti {
            position: fixed;
            width: 10px;
            height: 10px;
            background: #ff6b6b;
            animation: caer 3s linear infinite;
        }

        @keyframes caer {
            to {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* Mensaje troll */
        .troll-message {
            position: fixed;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            z-index: 1000;
            animation: parpadeo 1s infinite;
        }

        @keyframes parpadeo {
            0%, 50%, 100% { opacity: 1; }
            25%, 75% { opacity: 0.5; }
        }

        .sound-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            cursor: pointer;
            transition: opacity 0.3s ease;
        }

        .sound-prompt {
            text-align: center;
            color: white;
            animation: pulse 2s infinite;
        }

        .sound-icon {
            font-size: 60px;
            margin-bottom: 20px;
            animation: bounce 1s infinite;
        }

        .sound-text {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .sound-subtitle {
            font-size: 18px;
            opacity: 0.8;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
    </style>
</head>
<body>
    <div class="video-container">
        <!-- Video local descargado -->
        <video 
            class="video-fullscreen"
            autoplay 
            loop 
            muted 
            playsinline
            id="videoTroll">
            <source src="rickroll.mp4" type="video/mp4">
            Tu navegador no soporta videos.
        </video>
        
        <!-- Botón para cerrar (opcional) -->
        <div class="video-overlay">
            <button class="close-btn" onclick="window.close()">✕ Cerrar</button>
        </div>
        
        <!-- Mensaje troll -->
        <div class="troll-message">¡TE LA CREÍSTE! 😄🎵</div>
    </div>

    <script>
        // Crear confeti automáticamente
        function crearConfeti() {
            const colors = ['#ff6b6b', '#4ecdc4', '#45b7d1', '#f9ca24', '#f0932b', '#e74c3c', '#9b59b6', '#3498db'];
            
            setInterval(() => {
                const confeti = document.createElement('div');
                confeti.className = 'confeti';
                confeti.style.left = Math.random() * 100 + '%';
                confeti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confeti.style.animationDelay = Math.random() * 2 + 's';
                confeti.style.animationDuration = (Math.random() * 3 + 2) + 's';
                document.body.appendChild(confeti);
                
                setTimeout(() => {
                    confeti.remove();
                }, 5000);
            }, 200);
        }

        // Iniciar confeti
        crearConfeti();

        // Método agresivo para activar sonido automáticamente
        function forzarSonidoAutomatico() {
            const video = document.getElementById('videoTroll');
            
            // Método 1: Directamente unmute después de play
            video.play().then(() => {
                setTimeout(() => {
                    video.muted = false;
                    console.log('Sonido activado automáticamente');
                }, 100);
            }).catch(() => {
                // Método 2: Crear audio invisible
                const audio = new Audio('rickroll.mp4');
                audio.loop = true;
                audio.play().then(() => {
                    console.log('Audio invisible reproduciendo');
                }).catch(() => {
                    // Método 3: Simular interacción del usuario
                    document.body.click();
                    setTimeout(() => {
                        video.muted = false;
                        video.play();
                    }, 200);
                });
            });
        }

        // Múltiples intentos en diferentes momentos
        const video = document.getElementById('videoTroll');
        video.play();
        
        // Intentar inmediatamente
        forzarSonidoAutomatico();
        
        // Intentar después de cargar
        window.addEventListener('load', forzarSonidoAutomatico);
        
        // Intentar con retrasos
        setTimeout(forzarSonidoAutomatico, 500);
        setTimeout(forzarSonidoAutomatico, 1000);
        setTimeout(forzarSonidoAutomatico, 2000);
        
        // Ocultar overlay si existe
        const overlay = document.getElementById('soundOverlay');
        if (overlay) {
            overlay.style.display = 'none';
        }

        // Intentar pantalla completa automáticamente
        function entrarPantallaCompleta() {
            const elem = document.documentElement;
            if (elem.requestFullscreen) {
                elem.requestFullscreen();
            } else if (elem.webkitRequestFullscreen) {
                elem.webkitRequestFullscreen();
            } else if (elem.msRequestFullscreen) {
                elem.msRequestFullscreen();
            }
        }

        // Entrar en pantalla completa después de 1 segundo
        setTimeout(entrarPantallaCompleta, 1000);

        // Evitar cerrar con Escape
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                e.preventDefault();
                // Mostrar mensaje troll
                alert('¡No hay escape! 😈');
            }
        });

        // Mensaje en consola
        console.log('%c¡TE LA PUSIMOS! 🎉', 'font-size: 30px; color: #ff6b6b; font-weight: bold;');
        console.log('%cNever gonna give you up... 🎵', 'font-size: 20px; color: #4ecdc4;');
        console.log('%cNever gonna let you down... 😄', 'font-size: 20px; color: #45b7d1;');

        // Cambiar título de la pestaña
        let titulos = ['¡TE LA CREÍSTE!', '🎵 RICKROLL 🎵', '¡SORPRESA!', '😄 JAJAJA 😄'];
        let i = 0;
        setInterval(() => {
            document.title = titulos[i];
            i = (i + 1) % titulos.length;
        }, 2000);
    </script>
</body>
</html>
